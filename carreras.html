<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Retro Highway 2D - Deluxe Championship</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #gameWrapper {
      position: relative;
      width: 480px;
      height: 660px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #1e293b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 8px;
      border-left: 3px solid #ef4444;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    #pauseBtn {
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    #pauseBtn:hover {
      background: #334155;
    }
    #nitroBarContainer {
      position: absolute;
      bottom: 15px;
      left: 20px;
      right: 20px;
      height: 12px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 6px;
      border: 1px solid #475569;
      overflow: hidden;
      z-index: 5;
    }
    #nitroBar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.08s linear;
    }
    .nitro-active #nitroBar {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    /* Barra de progreso de carrera */
    #raceProgressBar {
      position: absolute;
      top: 50px;
      left: 12px;
      right: 12px;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #334155;
      z-index: 5;
    }
    #raceProgressFill {
      width: 0%;
      height: 100%;
      background: #10b981;
    }

    /* Modales */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.94);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 32px;
      color: #ef4444;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }
    .btn-action {
      width: 220px;
      padding: 12px 0;
      margin: 6px 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #ef4444;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      transition: background 0.15s, transform 0.15s;
    }
    .btn-action:hover {
      background: #dc2626;
      transform: scale(1.03);
    }
    .btn-secondary {
      background: #334155;
      box-shadow: 0 4px 14px rgba(51, 65, 85, 0.35);
    }
    .btn-secondary:hover {
      background: #475569;
    }

    /* Tienda */
    .shop-container {
      width: 100%;
      max-height: 400px;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .car-card {
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      text-align: left;
    }
    .car-card.selected {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }
    .car-info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    .car-info p {
      font-size: 12px;
      color: #94a3b8;
    }
    .btn-buy {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: #10b981;
    }
    .btn-buy:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    /* Tabla Récords */
    .table-records {
      width: 90%;
      border-collapse: collapse;
      margin-bottom: 18px;
      color: #cbd5e1;
      font-size: 14px;
    }
    .table-records th {
      color: #ef4444;
      padding: 8px;
      border-bottom: 2px solid #334155;
    }
    .table-records td {
      padding: 8px;
      border-bottom: 1px solid #1e293b;
    }

    /* Tarjetas de estadísticas */
    .stats-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 14px 28px;
      margin-bottom: 18px;
      width: 80%;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
      font-size: 15px;
      margin: 6px 0;
    }
    .stats-row span:last-child {
      color: #f8fafc;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="gameWrapper">
    <canvas id="gameCanvas" width="480" height="660"></canvas>

    <div id="raceProgressBar" style="display: none;">
      <div id="raceProgressFill"></div>
    </div>

    <!-- Barra de Nitro -->
    <div id="nitroBarContainer" style="display: none;">
      <div id="nitroBar"></div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display: none;">
      <div class="badge">VEL: <span id="uiSpeed">0</span> KM/H</div>
      <div class="badge" id="hudMetric">PUNTOS: <span id="uiScore">0</span></div>
      <div class="badge" style="border-color: #eab308;">⭐ <span id="uiCoins">0</span></div>
      <div class="hud-right">
        <div class="badge" id="shieldStatus" style="display: none; border-color: #38bdf8;">🛡️ ACTIVO</div>
        <button id="pauseBtn">PAUSA (P)</button>
      </div>
    </div>

    <!-- 1. Menú Principal -->
    <div id="mainMenu" class="overlay">
      <h1>HIGHWAY NITRO</h1>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
        Monedas: <b id="menuCoins" style="color: #eab308;">0</b> ⭐
      </p>
      <button class="btn-action" id="btnModeRace" style="background: #10b981;">MODO CARRERA</button>
      <button class="btn-action" id="btnModeEndless">SUPERVIVENCIA</button>
      <button class="btn-action btn-secondary" id="btnShop">GARAJE / TIENDA</button>
      <button class="btn-action btn-secondary" id="btnScores">RÉCORDS</button>
    </div>

    <!-- 2. Garaje / Tienda -->
    <div id="shopOverlay" class="overlay" style="display: none;">
      <h1 style="color: #38bdf8;">GARAJE</h1>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 12px;">
        Tus Monedas: <b id="shopCoins" style="color: #eab308;">0</b> ⭐
      </p>
      <div class="shop-container" id="carShopList"></div>
      <button class="btn-action btn-secondary" id="btnBackShop">VOLVER</button>
    </div>

    <!-- 3. Tabla de Récords -->
    <div id="scoresOverlay" class="overlay" style="display: none;">
      <h1 style="color: #f59e0b;">MEJORES RÉCORDS</h1>
      <table class="table-records">
        <thead>
          <tr>
            <th>#</th>
            <th>PUNTOS</th>
            <th>FECHA</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
      <button class="btn-action btn-secondary" id="btnBackScores">VOLVER</button>
    </div>

    <!-- 4. Pantalla de Pausa -->
    <div id="pauseOverlay" class="overlay" style="display: none;">
      <h1 style="color: #38bdf8;">EN PAUSA</h1>
      <button class="btn-action" id="btnResume">REANUDAR</button>
      <button class="btn-action btn-secondary" id="btnQuitToMenu">SALIR AL MENÚ</button>
    </div>

    <!-- 5. Pantalla de Fin de Carrera (Victoria / Podio) -->
    <div id="raceResultOverlay" class="overlay" style="display: none;">
      <h1 id="raceResultTitle" style="color: #10b981;">¡META ALCANZADA!</h1>
      <div class="stats-card">
        <div class="stats-row"><span>Posición final:</span><span id="statRacePos">1° Lugar</span></div>
        <div class="stats-row"><span>Recompensa:</span><span id="statRacePrize">+250 ⭐</span></div>
        <div class="stats-row"><span>Total acumulado:</span><span id="statRaceTotalCoins">0</span></div>
      </div>
      <button class="btn-action" id="btnRaceRestart">CORRER DE NUEVO</button>
      <button class="btn-action btn-secondary" id="btnRaceMenu">MENÚ PRINCIPAL</button>
    </div>

    <!-- 6. Game Over (Choque) -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h1>¡ACCIDENTE!</h1>
      <div class="stats-card">
        <div class="stats-row"><span>Puntuación:</span><span id="statScore">0</span></div>
        <div class="stats-row"><span>Monedas ganadas:</span><span id="statCoins">0</span></div>
        <div class="stats-row"><span>Total acumulado:</span><span id="statTotalCoins">0</span></div>
      </div>
      <button class="btn-action" id="btnRestart">REINTENTAR</button>
      <button class="btn-action btn-secondary" id="btnGameOverMenu">MENÚ PRINCIPAL</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Elementos UI
    const hud = document.getElementById('hud');
    const hudMetric = document.getElementById('hudMetric');
    const nitroBarContainer = document.getElementById('nitroBarContainer');
    const raceProgressBar = document.getElementById('raceProgressBar');
    const raceProgressFill = document.getElementById('raceProgressFill');
    const uiSpeed = document.getElementById('uiSpeed');
    const uiScore = document.getElementById('uiScore');
    const uiCoins = document.getElementById('uiCoins');
    const shieldStatus = document.getElementById('shieldStatus');
    const nitroBar = document.getElementById('nitroBar');
    const pauseBtn = document.getElementById('pauseBtn');

    // Modales
    const mainMenu = document.getElementById('mainMenu');
    const shopOverlay = document.getElementById('shopOverlay');
    const scoresOverlay = document.getElementById('scoresOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const raceResultOverlay = document.getElementById('raceResultOverlay');

    const menuCoins = document.getElementById('menuCoins');
    const shopCoins = document.getElementById('shopCoins');
    const carShopList = document.getElementById('carShopList');
    const recordsBody = document.getElementById('recordsBody');

    const statScore = document.getElementById('statScore');
    const statCoins = document.getElementById('statCoins');
    const statTotalCoins = document.getElementById('statTotalCoins');
    const raceResultTitle = document.getElementById('raceResultTitle');
    const statRacePos = document.getElementById('statRacePos');
    const statRacePrize = document.getElementById('statRacePrize');
    const statRaceTotalCoins = document.getElementById('statRaceTotalCoins');

    // Botones
    const btnModeRace = document.getElementById('btnModeRace');
    const btnModeEndless = document.getElementById('btnModeEndless');
    const btnShop = document.getElementById('btnShop');
    const btnScores = document.getElementById('btnScores');
    const btnBackShop = document.getElementById('btnBackShop');
    const btnBackScores = document.getElementById('btnBackScores');
    const btnResume = document.getElementById('btnResume');
    const btnQuitToMenu = document.getElementById('btnQuitToMenu');
    const btnRestart = document.getElementById('btnRestart');
    const btnGameOverMenu = document.getElementById('btnGameOverMenu');
    const btnRaceRestart = document.getElementById('btnRaceRestart');
    const btnRaceMenu = document.getElementById('btnRaceMenu');

    // Dimensiones de autopista
    const ROAD_X = 60;
    const ROAD_WIDTH = 360;
    const NUM_LANES = 4;
    const LANE_WIDTH = ROAD_WIDTH / NUM_LANES;
    const RACE_DISTANCE = 5000; // Distancia meta en metros

    // Catálogo de Autos
    const CARS = [
      { id: 'classic', name: 'Racer Rojo', price: 0, color: '#ef4444', normalMax: 13, nitroMax: 20, accel: 0.22, nitroCost: 0.7 },
      { id: 'phantom', name: 'Phantom Azul', price: 1500, color: '#0284c7', normalMax: 15, nitroMax: 22, accel: 0.26, nitroCost: 0.6 },
      { id: 'viper', name: 'Viper Verde', price: 3500, color: '#10b981', normalMax: 16, nitroMax: 24, accel: 0.30, nitroCost: 0.5 },
      { id: 'beast', name: 'Thunder Gold', price: 7000, color: '#eab308', normalMax: 18, nitroMax: 27, accel: 0.35, nitroCost: 0.4 }
    ];

    // Persistencia LocalStorage
    let totalCoins = parseInt(localStorage.getItem('hw_coins') || '0', 10);
    let unlockedCars = JSON.parse(localStorage.getItem('hw_unlocked') || '["classic"]');
    let selectedCarId = localStorage.getItem('hw_selected') || 'classic';
    let highScores = JSON.parse(localStorage.getItem('hw_scores') || '[]');

    function savePlayerData() {
      localStorage.setItem('hw_coins', totalCoins.toString());
      localStorage.setItem('hw_unlocked', JSON.stringify(unlockedCars));
      localStorage.setItem('hw_selected', selectedCarId);
      localStorage.setItem('hw_scores', JSON.stringify(highScores));
    }

    function getSelectedCar() {
      return CARS.find(c => c.id === selectedCarId) || CARS[0];
    }

    // Estado del juego
    let isRunning = false;
    let isPaused = false;
    let gameMode = 'endless'; // 'endless' o 'race'
    let score = 0;
    let matchCoins = 0;
    let distanceTraveled = 0;
    let playerPosition = 4;
    let roadOffsetY = 0;
    let spawnTimer = 0;
    let powerUpTimer = 0;

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 140,
      w: 40,
      h: 70,
      speed: 0,
      lateralSpeed: 6.5,
      nitro: 100,
      hasShield: false
    };

    let traffic = [];
    let racers = [];
    let powerUps = [];
    const trafficColors = ['#64748b', '#78716c', '#475569'];

    // Controles
    const keys = {};
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) e.preventDefault();
      if ((key === 'p' || key === 'escape') && isRunning) togglePause();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Audio Web API
    let audioCtx = null;
    let engineOsc = null;
    let engineGain = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          engineOsc = audioCtx.createOscillator();
          engineGain = audioCtx.createGain();

          engineOsc.type = 'sawtooth';
          engineOsc.frequency.value = 40;
          engineGain.gain.value = 0.03;

          engineOsc.connect(engineGain);
          engineGain.connect(audioCtx.destination);
          engineOsc.start();
        } else if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (_) {}
    }

    function playSound(freq, duration, type = 'sine') {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function playCrashSound() {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration || 0.35);
      } catch (_) {}
    }

    // Tienda & Récords
    function renderShop() {
      shopCoins.innerText = totalCoins;
      carShopList.innerHTML = '';

      CARS.forEach(car => {
        const isUnlocked = unlockedCars.includes(car.id);
        const isSelected = selectedCarId === car.id;
        const card = document.createElement('div');
        card.className = `car-card ${isSelected ? 'selected' : ''}`;

        let actionBtn = '';
        if (isSelected) {
          actionBtn = `<button class="btn-buy" disabled style="background:#38bdf8;">EN USO</button>`;
        } else if (isUnlocked) {
          actionBtn = `<button class="btn-buy" style="background:#3b82f6;" onclick="selectCar('${car.id}')">ELEGIR</button>`;
        } else {
          const canBuy = totalCoins >= car.price;
          actionBtn = `<button class="btn-buy" ${canBuy ? '' : 'disabled'} onclick="buyCar('${car.id}')">${car.price} ⭐</button>`;
        }

        card.innerHTML = `
          <div class="car-info">
            <h3 style="color:${car.color};">${car.name}</h3>
            <p>Vel. Máx: ${car.normalMax * 12} km/h | Nitro: ${car.nitroMax * 12} km/h</p>
          </div>
          <div>${actionBtn}</div>
        `;
        carShopList.appendChild(card);
      });
    }

    window.buyCar = function(carId) {
      const car = CARS.find(c => c.id === carId);
      if (car && totalCoins >= car.price && !unlockedCars.includes(carId)) {
        totalCoins -= car.price;
        unlockedCars.push(carId);
        selectedCarId = carId;
        savePlayerData();
        renderShop();
      }
    };

    window.selectCar = function(carId) {
      if (unlockedCars.includes(carId)) {
        selectedCarId = carId;
        savePlayerData();
        renderShop();
      }
    };

    function renderLeaderboard() {
      recordsBody.innerHTML = '';
      if (highScores.length === 0) {
        recordsBody.innerHTML = '<tr><td colspan="3">Aún no hay récords registrados</td></tr>';
        return;
      }
      highScores.slice(0, 5).forEach((rec, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:bold; color:#ef4444;">#${idx + 1}</td>
          <td><b>${rec.score}</b> pts</td>
          <td style="color:#94a3b8; font-size:12px;">${rec.date}</td>
        `;
        recordsBody.appendChild(tr);
      });
    }

    function recordScore(pts) {
      const now = new Date();
      const dateStr = `${now.getDate()}/${now.getMonth() + 1} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      highScores.push({ score: pts, date: dateStr });
      highScores.sort((a, b) => b.score - a.score);
      highScores = highScores.slice(0, 5);
      savePlayerData();
    }

    // Inicialización del Modo Carrera
    function initChampionshipRacers() {
      racers = [
        { name: 'Apex', color: '#38bdf8', lane: 0, distance: 300, baseSpeed: 12.8, y: -200 },
        { name: 'Fury', color: '#f59e0b', lane: 2, distance: 200, baseSpeed: 13.5, y: -100 },
        { name: 'Blaze', color: '#ec4899', lane: 3, distance: 100, baseSpeed: 12.0, y: -20 }
      ];
      racers.forEach(r => {
        r.w = 40;
        r.h = 70;
        r.x = ROAD_X + (r.lane * LANE_WIDTH) + (LANE_WIDTH / 2) - 20;
        r.speed = r.baseSpeed;
      });
    }

    // Generación de tráfico pasivo
    function spawnTrafficCar() {
      const lane = Math.floor(Math.random() * NUM_LANES);
      const laneCenter = ROAD_X + (lane * LANE_WIDTH) + (LANE_WIDTH / 2);
      const carW = 38;
      const carH = 68;

      const overlapping = traffic.some(car => car.y < -120 && Math.abs(car.x + car.w / 2 - laneCenter) < LANE_WIDTH / 2);
      if (overlapping) return;

      traffic.push({
        x: laneCenter - carW / 2,
        y: -100,
        w: carW,
        h: carH,
        speed: 3.5 + Math.random() * 3.5,
        color: trafficColors[Math.floor(Math.random() * trafficColors.length)]
      });
    }

    function spawnPowerUp() {
      const types = ['nitro', 'shield', 'coin'];
      const type = types[Math.floor(Math.random() * types.length)];
      const lane = Math.floor(Math.random() * NUM_LANES);
      const laneCenter = ROAD_X + (lane * LANE_WIDTH) + (LANE_WIDTH / 2);

      powerUps.push({
        x: laneCenter - 14,
        y: -50,
        w: 28,
        h: 28,
        type: type
      });
    }

    function checkCollision(r1, r2) {
      const inset = 4;
      return !(
        r1.x + inset > r2.x + r2.w - inset ||
        r1.x + r1.w - inset < r2.x + inset ||
        r1.y + inset > r2.y + r2.h - inset ||
        r1.y + r1.h - inset < r2.y + inset
      );
    }

    function drawCar(c, isPlayer = false, isNitro = false) {
      if (isPlayer && isNitro) {
        ctx.fillStyle = Math.random() > 0.5 ? '#f97316' : '#38bdf8';
        ctx.fillRect(c.x + 8, c.y + c.h, 7, 12 + Math.random() * 10);
        ctx.fillRect(c.x + c.w - 15, c.y + c.h, 7, 12 + Math.random() * 10);
      }

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(c.x + 3, c.y + 4, c.w, c.h);

      ctx.fillStyle = isPlayer ? getSelectedCar().color : c.color;
      ctx.beginPath();
      ctx.roundRect(c.x, c.y, c.w, c.h, 6);
      ctx.fill();

      // Ruedas
      ctx.fillStyle = '#09090b';
      ctx.fillRect(c.x - 3, c.y + 10, 4, 14);
      ctx.fillRect(c.x + c.w - 1, c.y + 10, 4, 14);
      ctx.fillRect(c.x - 3, c.y + c.h - 24, 4, 14);
      ctx.fillRect(c.x + c.w - 1, c.y + c.h - 24, 4, 14);

      // Techo
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.roundRect(c.x + 4, c.y + 16, c.w - 8, c.h - 32, 4);
      ctx.fill();

      // Parabrisas
      ctx.fillStyle = isPlayer ? '#38bdf8' : '#64748b';
      ctx.fillRect(c.x + 6, c.y + 18, c.w - 12, 10);

      // Luces
      ctx.fillStyle = isPlayer ? '#ef4444' : '#f87171';
      ctx.fillRect(c.x + 5, c.y + c.h - 4, 8, 3);
      ctx.fillRect(c.x + c.w - 13, c.y + c.h - 4, 8, 3);

      ctx.fillStyle = '#fef08a';
      ctx.fillRect(c.x + 5, c.y + 2, 8, 3);
      ctx.fillRect(c.x + c.w - 13, c.y + 2, 8, 3);

      if (isPlayer && player.hasShield) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(c.x + c.w / 2, c.y + c.h / 2, 38, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawPowerUp(p) {
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);

      if (p.type === 'nitro') {
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('⚡', -7, 5);
      } else if (p.type === 'shield') {
        ctx.fillStyle = '#059669';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('🛡️', -8, 5);
      } else if (p.type === 'coin') {
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('⭐', -7, 5);
      }
      ctx.restore();
    }

    function drawRoad() {
      ctx.fillStyle = '#166534';
      ctx.fillRect(0, 0, ROAD_X, canvas.height);
      ctx.fillRect(ROAD_X + ROAD_WIDTH, 0, ROAD_X, canvas.height);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(ROAD_X, 0, ROAD_WIDTH, canvas.height);

      // Línea de meta visible si está cerca del final
      if (gameMode === 'race' && distanceTraveled >= RACE_DISTANCE - 40) {
        const finishY = canvas.height - 140 - (RACE_DISTANCE - distanceTraveled) * 10;
        ctx.fillStyle = '#ffffff';
        for (let x = ROAD_X; x < ROAD_X + ROAD_WIDTH; x += 20) {
          ctx.fillRect(x, finishY, 10, 10);
          ctx.fillRect(x + 10, finishY + 10, 10, 10);
        }
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ROAD_X - 4, 0, 4, canvas.height);
      ctx.fillRect(ROAD_X + ROAD_WIDTH, 0, 4, canvas.height);

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#64748b';
      ctx.setLineDash([24, 20]);
      ctx.lineDashOffset = -roadOffsetY;

      for (let i = 1; i < NUM_LANES; i++) {
        const x = ROAD_X + (i * LANE_WIDTH);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function update() {
      const carStats = getSelectedCar();
      const isNitroActive = (keys[' '] || keys['shift']) && player.nitro > 0;
      const currentMax = isNitroActive ? carStats.nitroMax : carStats.normalMax;

      // Físicas del jugador
      if (isNitroActive) {
        player.nitro = Math.max(0, player.nitro - carStats.nitroCost);
        player.speed = Math.min(currentMax, player.speed + carStats.accel * 2);
      } else {
        player.nitro = Math.min(100, player.nitro + 0.05);

        if (keys['arrowup'] || keys['w']) {
          player.speed = Math.min(currentMax, player.speed + carStats.accel);
        } else if (keys['arrowdown'] || keys['s']) {
          player.speed = Math.max(4, player.speed - 0.35);
        } else {
          if (player.speed > 8) player.speed -= 0.12;
          else if (player.speed < 8) player.speed += carStats.accel * 0.3;
        }
      }

      nitroBar.style.width = `${player.nitro}%`;
      if (isNitroActive) nitroBarContainer.classList.add('nitro-active');
      else nitroBarContainer.classList.remove('nitro-active');

      if (keys['arrowleft'] || keys['a']) player.x -= player.lateralSpeed;
      if (keys['arrowright'] || keys['d']) player.x += player.lateralSpeed;

      player.x = Math.max(ROAD_X, Math.min(ROAD_X + ROAD_WIDTH - player.w, player.x));
      roadOffsetY = (roadOffsetY + player.speed) % 44;

      // Actualizar avance en Modo Carrera
      if (gameMode === 'race') {
        distanceTraveled += player.speed * 0.08;
        const progress = Math.min(100, (distanceTraveled / RACE_DISTANCE) * 100);
        raceProgressFill.style.width = `${progress}%`;

        // Lógica de rivales IA
        let rank = 1;
        racers.forEach(r => {
          r.distance += r.speed * 0.08;
          // Variación orgánica de velocidad de la IA
          r.speed = r.baseSpeed + Math.sin(distanceTraveled * 0.01 + r.lane) * 1.5;

          // Posición relativa en pantalla
          const distDelta = r.distance - distanceTraveled;
          r.y = (canvas.height - 140) - (distDelta * 12);

          if (r.distance > distanceTraveled) rank++;

          // Colisión con rivales
          if (r.y > -80 && r.y < canvas.height + 80) {
            if (checkCollision(player, r)) {
              if (player.hasShield) {
                player.hasShield = false;
                shieldStatus.style.display = 'none';
                playSound(300, 0.25, 'triangle');
                r.distance -= 20;
              } else {
                gameOver();
                return;
              }
            }
          }
        });

        playerPosition = rank;
        hudMetric.innerHTML = `POS: <span style="color:#f59e0b;">${playerPosition}/4</span> | META: ${Math.max(0, Math.floor(RACE_DISTANCE - distanceTraveled))}m`;

        // Llegada a la meta
        if (distanceTraveled >= RACE_DISTANCE) {
          finishRace();
          return;
        }
      } else {
        // Modo Supervivencia
        score += Math.floor(player.speed * 0.5);
        hudMetric.innerHTML = `PUNTOS: <span id="uiScore">${score}</span>`;
      }

      // Tráfico general
      spawnTimer++;
      const trafficInterval = gameMode === 'race' ? 65 : Math.max(22, 60 - Math.floor(score / 600));
      if (spawnTimer > trafficInterval) {
        spawnTrafficCar();
        spawnTimer = 0;
      }

      powerUpTimer++;
      if (powerUpTimer > 260) {
        spawnPowerUp();
        powerUpTimer = 0;
      }

      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.y += (player.speed - car.speed);

        if (checkCollision(player, car)) {
          if (player.hasShield) {
            player.hasShield = false;
            shieldStatus.style.display = 'none';
            playSound(300, 0.25, 'triangle');
            traffic.splice(i, 1);
            continue;
          } else {
            gameOver();
            return;
          }
        }

        if (car.y > canvas.height + 100 || car.y < -250) {
          traffic.splice(i, 1);
        }
      }

      // Power-Ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += player.speed;

        if (checkCollision(player, p)) {
          if (p.type === 'nitro') {
            player.nitro = 100;
            playSound(580, 0.2);
          } else if (p.type === 'shield') {
            player.hasShield = true;
            shieldStatus.style.display = 'block';
            playSound(700, 0.2);
          } else if (p.type === 'coin') {
            if (gameMode === 'endless') score += 500;
            matchCoins += 50;
            totalCoins += 50;
            savePlayerData();
            playSound(880, 0.15);
          }
          powerUps.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 50) {
          powerUps.splice(i, 1);
        }
      }

      if (engineOsc && audioCtx && audioCtx.state === 'running') {
        engineOsc.frequency.value = 40 + (player.speed / carStats.nitroMax) * 90;
      }

      uiSpeed.innerText = Math.round(player.speed * 12);
      uiCoins.innerText = matchCoins;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawRoad();
      for (const p of powerUps) drawPowerUp(p);
      for (const car of traffic) drawCar(car, false);

      // Dibujar rivales de carrera
      if (gameMode === 'race') {
        for (const r of racers) {
          if (r.y > -80 && r.y < canvas.height + 80) {
            drawCar(r, false);
          }
        }
      }

      const isNitroActive = (keys[' '] || keys['shift']) && player.nitro > 0;
      drawCar(player, true, isNitroActive);
    }

    function gameLoop() {
      if (!isRunning || isPaused) return;
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;

      if (isPaused) {
        pauseOverlay.style.display = 'flex';
        pauseBtn.innerText = 'REANUDAR';
        if (engineGain) engineGain.gain.value = 0.001;
      } else {
        pauseOverlay.style.display = 'none';
        pauseBtn.innerText = 'PAUSA (P)';
        if (engineGain) engineGain.gain.value = 0.03;
        requestAnimationFrame(gameLoop);
      }
    }

    function finishRace() {
      isRunning = false;
      let prize = 0;
      let title = '';

      if (playerPosition === 1) {
        title = '¡CAMPEÓN DE LA PISTA!';
        prize = 600;
        raceResultTitle.style.color = '#10b981';
      } else if (playerPosition === 2) {
        title = '¡2° PUESTO (PODIO)!';
        prize = 350;
        raceResultTitle.style.color = '#38bdf8';
      } else if (playerPosition === 3) {
        title = '¡3° PUESTO (PODIO)!';
        prize = 200;
        raceResultTitle.style.color = '#f59e0b';
      } else {
        title = 'FUERA DEL PODIO';
        prize = 50;
        raceResultTitle.style.color = '#ef4444';
      }

      totalCoins += prize;
      matchCoins += prize;
      savePlayerData();

      raceResultTitle.innerText = title;
      statRacePos.innerText = `${playerPosition}° Lugar`;
      statRacePrize.innerText = `+${prize} ⭐`;
      statRaceTotalCoins.innerText = totalCoins;

      hud.style.display = 'none';
      nitroBarContainer.style.display = 'none';
      raceProgressBar.style.display = 'none';
      raceResultOverlay.style.display = 'flex';

      if (engineGain) engineGain.gain.value = 0.001;
    }

    function gameOver() {
      isRunning = false;
      playCrashSound();

      if (gameMode === 'endless') {
        recordScore(score);
        statScore.innerText = score;
      } else {
        statScore.innerText = `Distancia: ${Math.floor(distanceTraveled)}m`;
      }

      statCoins.innerText = matchCoins;
      statTotalCoins.innerText = totalCoins;

      hud.style.display = 'none';
      nitroBarContainer.style.display = 'none';
      raceProgressBar.style.display = 'none';
      gameOverOverlay.style.display = 'flex';

      if (engineGain) engineGain.gain.value = 0.001;
    }

    function startGame(mode) {
      initAudio();
      if (engineGain) engineGain.gain.value = 0.03;

      gameMode = mode;
      score = 0;
      matchCoins = 0;
      distanceTraveled = 0;
      playerPosition = 4;

      player.x = canvas.width / 2 - player.w / 2;
      player.speed = 8;
      player.nitro = 100;
      player.hasShield = false;
      shieldStatus.style.display = 'none';

      traffic = [];
      powerUps = [];
      spawnTimer = 0;
      powerUpTimer = 0;
      roadOffsetY = 0;

      if (gameMode === 'race') {
        initChampionshipRacers();
        raceProgressBar.style.display = 'block';
        raceProgressFill.style.width = '0%';
      } else {
        raceProgressBar.style.display = 'none';
      }

      uiSpeed.innerText = '0';
      uiCoins.innerText = '0';

      mainMenu.style.display = 'none';
      shopOverlay.style.display = 'none';
      scoresOverlay.style.display = 'none';
      pauseOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      raceResultOverlay.style.display = 'none';

      hud.style.display = 'flex';
      nitroBarContainer.style.display = 'block';

      isRunning = true;
      isPaused = false;
      pauseBtn.innerText = 'PAUSA (P)';

      requestAnimationFrame(gameLoop);
    }

    function showMainMenu() {
      isRunning = false;
      isPaused = false;
      if (engineGain) engineGain.gain.value = 0.001;

      hud.style.display = 'none';
      nitroBarContainer.style.display = 'none';
      raceProgressBar.style.display = 'none';
      shopOverlay.style.display = 'none';
      scoresOverlay.style.display = 'none';
      pauseOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      raceResultOverlay.style.display = 'none';

      menuCoins.innerText = totalCoins;
      mainMenu.style.display = 'flex';

      drawRoad();
      drawCar(player, true);
    }

    // Eventos
    btnModeRace.addEventListener('click', () => startGame('race'));
    btnModeEndless.addEventListener('click', () => startGame('endless'));

    btnRestart.addEventListener('click', () => startGame(gameMode));
    btnRaceRestart.addEventListener('click', () => startGame('race'));

    btnResume.addEventListener('click', togglePause);
    pauseBtn.addEventListener('click', togglePause);

    btnShop.addEventListener('click', () => {
      mainMenu.style.display = 'none';
      renderShop();
      shopOverlay.style.display = 'flex';
    });

    btnBackShop.addEventListener('click', () => {
      shopOverlay.style.display = 'none';
      showMainMenu();
    });

    btnScores.addEventListener('click', () => {
      mainMenu.style.display = 'none';
      renderLeaderboard();
      scoresOverlay.style.display = 'flex';
    });

    btnBackScores.addEventListener('click', () => {
      scoresOverlay.style.display = 'none';
      showMainMenu();
    });

    btnQuitToMenu.addEventListener('click', showMainMenu);
    btnGameOverMenu.addEventListener('click', showMainMenu);
    btnRaceMenu.addEventListener('click', showMainMenu);

    // Arranque en Menú Principal
    showMainMenu();
  </script>
</body>
</html>
